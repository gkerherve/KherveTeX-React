name: Mac Intel build

# The Intel Mac build of a release, on GitHub: the Apple Silicon one is
# built on the owner's Mac (scripts/mac_release.sh), Windows and Linux by
# release.yml. Run it from the Actions tab (or `gh workflow run
# mac-intel.yml -f tag=vN`) once the tag is pushed: it builds the tag for
# x86_64 on a macOS runner (cross-compiled, as on the owner's Mac), signed
# for the in-app updater, uploads the .dmg, its checksum and
# kTeX_x64.app.tar.gz (+ .sig) to the release, draft or published, and
# writes latest.json again so the updater offers it to Intel Macs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (vN)"
        required: true
      python_ref:
        description: "Branch or tag of gkerherve/kherveTeX whose TeX cache and styles ship"
        default: dev

permissions:
  contents: write

concurrency:
  group: mac-intel-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: KherveTeX-React
    env:
      TARGET: x86_64-apple-darwin
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: KherveTeX-React

      - name: Check out the Python app (TeX cache and styles)
        uses: actions/checkout@v4
        with:
          repository: gkerherve/kherveTeX
          ref: ${{ inputs.python_ref }}
          path: KherveTeX

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KherveTeX/requirements.txt

      - name: Restore the warmed TeX cache
        id: texcache
        uses: actions/cache@v4
        with:
          path: |
            KherveTeX/khervedoc/tectonic_cache
            KherveTeX/khervedoc/tectonic_cache.stamp
          key: tectonic-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('KherveTeX/khervedoc/**/*.py', 'KherveTeX/packaging/fetch_tectonic.py') }}

      - name: Fetch tectonic and warm the offline TeX cache
        if: steps.texcache.outputs.cache-hit != 'true'
        working-directory: KherveTeX
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python packaging/fetch_tectonic.py --warm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KherveTeX-React/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: KherveTeX-React/src-tauri -> target
          key: x86_64-apple-darwin

      - run: npm ci --legacy-peer-deps

      - name: Check the tag is this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v${VERSION%%.*}" = "$TAG" ] || { echo "package.json is $VERSION, not $TAG" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and sign for Intel Macs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target "$TARGET"

      - name: Check the bundle is Intel
        run: |
          set -euo pipefail
          B=src-tauri/target/$TARGET/release/bundle
          for f in "$B"/macos/kTeX.app/Contents/MacOS/*; do lipo -archs "$f" | grep -qw x86_64 || { echo "$f is not x86_64" >&2; exit 1; }; done
          test -x "$B/macos/kTeX.app/Contents/MacOS/tectonic"
          test -d "$B/macos/kTeX.app/Contents/Resources/resources/tectonic_cache"
          ls -la "$B"/dmg "$B"/macos

      - name: Upload to the release and write latest.json again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          B=src-tauri/target/$TARGET/release/bundle
          OUT=$RUNNER_TEMP/out; mkdir -p "$OUT"
          cp "$B/dmg/kTeX_${VERSION}_x64.dmg" "$OUT/"
          (cd "$OUT" && shasum -a 256 "kTeX_${VERSION}_x64.dmg" > "kTeX_${VERSION}_x64.dmg.sha256")
          cp "$B/macos/kTeX.app.tar.gz" "$OUT/kTeX_x64.app.tar.gz"
          cp "$B/macos/kTeX.app.tar.gz.sig" "$OUT/kTeX_x64.app.tar.gz.sig"
          ID=$(gh api "repos/$R/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          test -n "$ID"
          # GitHub's API fails now and then (HTTP 500): retried, a broken
          # asset deleted first.
          for f in "$OUT"/*; do
            n=$(basename "$f")
            for i in 1 2 3 4 5 6; do
              st=$(gh api "repos/$R/releases/$ID/assets" --paginate --jq ".[] | select(.name==\"$n\") | .state" || true)
              [ "$st" = uploaded ] && break
              if [ -n "$st" ]; then
                aid=$(gh api "repos/$R/releases/$ID/assets" --paginate --jq ".[] | select(.name==\"$n\") | .id")
                gh api --method DELETE "repos/$R/releases/assets/$aid" || true
              fi
              gh api --method POST -H "Content-Type: application/octet-stream" --input "$f" \
                "https://uploads.github.com/repos/$R/releases/$ID/assets?name=$n" --jq .name || sleep 15
            done
          done
          # The manifest from every signed bundle now on the release.
          gh api "repos/$R/releases/$ID" --jq .body > notes.txt
          mkdir -p sigs
          gh api "repos/$R/releases/$ID/assets" --paginate --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r id name; do gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$id" > "sigs/$name"; done
          ls sigs
          # Windows not on the draft yet: release.yml's publish step writes
          # latest.json when it is, from every bundle (this one included).
          if ! node scripts/latest_json.mjs "$R" "$TAG" "$VERSION" notes.txt sigs > latest.json; then
            echo "Not every platform is on the release yet: its publish step writes latest.json."
            exit 0
          fi
          cat latest.json
          OLD=$(gh api "repos/$R/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          for id in $OLD; do gh api --method DELETE "repos/$R/releases/assets/$id"; done
          gh api --method POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$R/releases/$ID/assets?name=latest.json" > /dev/null
