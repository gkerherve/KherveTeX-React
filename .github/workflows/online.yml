name: kTeX online

# Builds the browser version (npm run build:web: the editor plus the
# SwiftLaTeX engines) and publishes it with GitHub Pages at
# https://gkerherve.github.io/KherveTeX-React/; khervetools.com/try/ sends
# visitors there. Runs with each release tag, so the online version is the
# released one, or by hand from the Actions tab. Its TeX files come from
# gkerherve/ktex-texlive (scripts/texlive_tree.mjs).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: online
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build:web

      - name: Check the engines are in the build
        run: ls -la dist/swiftlatex dist/swiftlatex/swiftlatexxetex.wasm dist/swiftlatex/swiftlatexdvipdfm.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
