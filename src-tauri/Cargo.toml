[package]
name = "khervetex"
version = "0.2.0"
description = "KherveTeX - WYSIWYG editor that writes LaTeX"
authors = ["Gwilherm Kerherve"]
license = "GPL-3.0-or-later"
repository = "https://github.com/gkerherve/kherveTeX"
edition = "2024"
rust-version = "1.90"

[lib]
name = "khervetex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

# Small binary
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
