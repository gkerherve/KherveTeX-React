[package]
name = "khervetex"
version = "0.2.0"
description = "KherveTeX - WYSIWYG editor that writes LaTeX"
authors = ["Gwilherm Kerherve"]
license = "GPL-3.0-or-later"
repository = "https://github.com/gkerherve/kherveTeX"
edition = "2024"
rust-version = "1.90"

[lib]
name = "khervetex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.14"
# git_backend.py's pygit2: libgit2 built in, with HTTPS (SecureTransport /
# WinHTTP) and SSH (libssh2 over a vendored OpenSSL) so no system library is needed.
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
chrono = "0.4"
# The MCP bridge token (secrets.token_urlsafe); already in the tree via tauri.
getrandom = "0.3"

# The Overleaf Git token, remembered between sessions in the system's
# credential store (macOS Keychain, Windows Credential Manager).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Small binary
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
